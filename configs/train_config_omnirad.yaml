model:
    model_name: "hf_hub:Snarcy/OmniRad-base"
    pretrained: True
    enc_num_classes: 0 # Returns embeddings if 0
    cls_num_classes: 1 # 1 for binary classification
    att_fusion: True
    img_pooling: "flatten" # att_fusion image tokens: flatten | gap
    use_clinical: True
    clin_feature_dim: 32
    clin_input_dim: 4
    img_feature_dim: 256
    use_dense_features: True
    cls_dropout_p: 0.2
training:
    cache_tag: "fullgoc"
    data_dir: "data"
    csv_file: "data/combined_lesion_allds_gs.csv"
    goc_id_map: "data/GOC_Data/anonymid_studyid_map_v4.json"
    target_shape: [25, 150, 150]
    cache_dir: "data/preprocessed_cache"
    output_dir: "results/training_outputs"
    checkpoint_dir: null
    datasets: "picai+goc"
    cspca_threshold: 7.0
    loss_fn: "bce"
    optimizer: "adamw"
    batch_size: 8
    num_epochs: 80
    learning_rate: 1.0e-05 #5.975984302421896e-5
    weight_decay: 0.01 #7.18234004627524e-5
    warmup_frac: 0.2 # 0.1 for flatten-vs-GAP ablation runs
    finetune_lr: 1.0e-06 #9.181756430361374e-6
    finetune_wd: 0.01 #0.0001397398926274772
    num_workers: 10
    log_frequency: 10
    save_frequency: 10
    val_split: 0.2
    weighted_sampling: False
    finetune: True
    finetune_t: "v5"
    seed: 43
