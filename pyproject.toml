[project]
name = "agoracls"
version = "1.0.0"
description = "Clinically significant prostate cancer classification from biparametric MRI with 3D CNNs and 2D foundation-model encoders"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cupy-cuda12x==13.6.0",
    "h5py==3.12.1",
    "matplotlib==3.10.0",
    "mlflow==3.14.0",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "pydicom==3.0.1",
    "pyyaml==6.0.2",
    "ray[tune]==2.47.1",
    "rich==13.9.4",
    "scikit-learn==1.6.0",
    "scipy==1.15.0",
    "simpleitk==2.4.0",
    "timm==1.0.22",
    "torch==2.11.0",
    "torchinfo==1.8.0",
    "torchio==0.20.3",
    "torchvision==0.26.0",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
